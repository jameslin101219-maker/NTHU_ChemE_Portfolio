<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入 - NTHU CHE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f8; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: '微軟正黑體', sans-serif;}
        .login-card { width: 100%; max-width: 400px; padding: 40px; border-radius: 20px; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background-color: white; color: #757575; border: 1px solid #ddd; padding: 12px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: 0.2s; }
        .google-btn:hover { background-color: #f8f9fa; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #333; }
        .guest-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background-color: #f1f5f9; color: #475569; border: 1px dashed #cbd5e1; padding: 10px; border-radius: 8px; font-weight: bold; text-decoration: none; transition: 0.2s; margin-top: 15px; }
        .guest-btn:hover { background-color: #e2e8f0; color: #1e293b; border-style: solid; }
        .google-icon { width: 24px; height: 24px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="mb-2" style="font-weight: 800; color: #1e293b;">NTHU CHE</h3>
        <p class="text-muted small mb-4">排課模擬系統</p>
        
        <a href="/login/google" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            使用 Google 帳號登入
        </a>
        
        <a href="/guest-login" class="guest-btn">
            👤 進入訪客測試模式
        </a>
    </div>
</body>
</html>
