<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTHU CHE 排課模擬系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 🌟 全站共用基礎樣式 */
        body { 
            background-color: #f4f6f8; 
            font-family: '微軟正黑體', sans-serif;
            zoom: 80%; /* 維持你喜歡的精緻縮小版面 */
        }
        
        /* 🌟 頂部導覽列樣式 */
        .top-navbar { 
            background: #ffffff; 
            padding: 15px 30px; 
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
            position: sticky; 
            top: 0; 
            z-index: 1040;
        }

        /* 🌟 側邊選單按鈕與連結樣式 */
        .menu-btn { color: #ae94c4; border-color: #ae94c4; font-weight: bold; }
        .menu-btn:hover { background-color: #ae94c4; color: white; }
        
        .nav-link-custom { 
            padding: 15px 20px; 
            color: #475569; 
            font-weight: 600; 
            border-radius: 10px; 
            transition: 0.3s; 
            margin-bottom: 8px; 
            display: block; 
            text-decoration: none; 
            border: 1px solid transparent;
        }
        .nav-link-custom:hover { 
            background-color: #f8fafc; 
            color: #ae94c4; 
            border-color: #ae94c4;
            transform: translateX(5px);
        }
        
        /* 側邊欄標題的莫蘭迪紫 */
        .offcanvas-title { color: #ae94c4; font-weight: 800; }
    </style>
</head>
<body>

    <nav class="top-navbar d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <button class="btn menu-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
                ☰ <span class="ms-1">功能選單</span>
            </button>
            <h3 class="m-0 fw-bold" style="color: #1e293b;">NTHU CHE 排課模擬系統</h3>
        </div>
        <div>
            <span class="me-3 text-secondary fw-bold">你好，{{ session.username }}</span>
            <a href="/logout" class="btn btn-sm btn-outline-danger rounded-pill">登出</a>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start shadow" tabindex="-1" id="sidebarMenu" style="width: 300px; border-right: none;">
        <div class="offcanvas-header border-bottom pb-3 mt-2">
            <h4 class="offcanvas-title">📍 系統導覽目錄</h4>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-4">
            <a href="/" class="nav-link-custom">🏠 修課總覽 (Dashboard)</a>
            <a href="/planning" class="nav-link-custom">📅 模擬排課系統</a>
            <a href="/general-ed" class="nav-link-custom">🏛️ 通識向度詳情</a>
            <a href="/language" class="nav-link-custom">🗣️ 語文課程概況</a>
            <a href="/pe" class="nav-link-custom">🏅 體育修課進度</a>
        </div>
    </div>

    <div class="container-fluid py-4" style="max-width: 1400px;">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
