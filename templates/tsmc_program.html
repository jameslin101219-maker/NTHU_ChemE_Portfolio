{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <h2 class="fw-bold">學程進度追蹤面板</h2>
        <select id="program-selector" class="form-select w-25">
            {% for prog in all_programs %}
                <option value="{{ prog }}" {% if prog == current_program %}selected{% endif %}>{{ prog }}</option>
            {% endfor %}
        </select>
        <button id="btn-import" class="btn btn-success">🚀 一鍵帶入課程</button>
    </div>

    <div class="row g-4">
        {% for cat_name, cat_data in progress.items() %}
            {% if cat_data.subjects | length > 0 %}
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h4 class="fw-bold">{{ cat_name }}</h4>
                    {% for sub_name, sub_data in cat_data.subjects.items() %}
                        <div class="card mb-2 p-2 bg-light border-0" style="cursor: pointer;" 
                             onclick="showCourseModal('{{ sub_name }}')">
                            {{ sub_name }}
                        </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}
        {% endfor %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. 處理學程切換
        document.getElementById('program-selector').addEventListener('change', function() {
            window.location.href = '/tsmc_program?program=' + encodeURIComponent(this.value);
        });

        // 2. 處理一鍵帶入
        document.getElementById('btn-import').addEventListener('click', function() {
            const prog = document.getElementById('program-selector').value;
            fetch('/api/add_tsmc_courses', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({program_name: prog}) 
            })
            .then(r => r.json())
            .then(d => { 
                alert(d.message); 
                window.location.reload(); 
            });
        });
    });

    // 簡單的顯示函數
    function showCourseModal(subName) {
        alert("顯示 " + subName + " 的詳細資訊");
        // 若你需要彈窗，這裡接 Bootstrap 的 modal.show()
    }
</script>
{% endblock %}
